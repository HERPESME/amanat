[project]
name = "amanat"
version = "0.1.0"
description = "Amount-contingent settlement for agent-initiated payments, with a signed evidence chain over rail state transitions."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "pyarrow>=15.0"]
agent = ["anthropic>=0.116"]
gemini = ["google-genai>=1.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amanat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
