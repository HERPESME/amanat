"seq": 6, "prev_hash": "8ef7c2e7bff9913ab8f2bf1bff4c79acff997a67d53f9863e25491681ee67383", "timestamp": "2026-09-20T12:55:22.082722+00:00", "actor": "agent", "event_type": "proposal", "payload": {"action": "debit", "amount": 47000, "payee": "citycabs", "reason": "metered fare"}, "hash": "e028b6d6591ccb40570bf57dddd5334436e5f4cbceaeda984966d68795e5290d", "signature": "76f3bbe12fda9cba26fdf9dcacca276d7bbe803411bab13c858e33d3dc5a19df7eb7839f542f8fc9684313f176b09ef4f4b9d94d21378a2ee99fdb724f3a2f01"}, {"seq": 7, "prev_hash": "e028b6d6591ccb40570bf57dddd5334436e5f4cbceaeda984966d68795e5290d", "timestamp": "2026-09-20T12:55:22.083192+00:00", "actor": "policy", "event_type": "policy_decision", "payload": {"action": "debit", "proposed_amount": 47000, "payee": "citycabs", "rail": "cashfree_preauth", "allowed": true, "reason": "permitted on Cashfree UPI pre-authorization", "citation": "", "quote": ""}, "hash": "2bd259658ca7fe5abf3ba81da88773d77e195b4f5181bee2a4af3b8ab9a8c6a3", "signature": "7183f8328a8f019868bbfff0fc2758fe0991ea2a246918993a21904de5c7e071d1c38f339529c58cc9f60f61ba54b313c5836b7c76f88e94c4b0e4454d74e003"}, {"seq": 8, "prev_hash": "2bd259658ca7fe5abf3ba81da88773d77e195b4f5181bee2a4af3b8ab9a8c6a3", "timestamp": "2026-09-20T12:55:23.054971+00:00", "actor": "rail", "event_type": "rail_transition", "payload": {"action": "debit", "amount": 47000, "outcome": "applied", "rail": "cashfree_preauth", "order_id": "amanat_pa_1789908920", "http_status": 200, "captured_amount": 47000, "payment_message": "PRE_AUTH|Transaction Success", "note": "partial capture accepted in the sandbox \u2014 Razorpay refuses the same shape with HTTP 400"}, "hash": "d6c951081c2ab45ea718d51fd4dc785dbe6eb1fdc7c390a790696c820fd8c4f5", "signature": "5ef9634deec0a96b2cf6d7505799f4f16a82fb52e82f2040a8e9294f7f4c60086d8177f522e4c16eed44e6048319d22d7a8ec6defb67f437c44943b67e9f060f"}, {"seq": 9, "prev_hash": "d6c951081c2ab45ea718d51fd4dc785dbe6eb1fdc7c390a790696c820fd8c4f5", "timestamp": "2026-09-20T12:55:23.454031+00:00", "actor": "rail", "event_type": "rail_transition", "payload": {"action": "observe", "outcome": "observed", "rail": "cashfree_preauth", "order_id": "amanat_pa_1789908920", "http_status": 200, "state": {"order_status": "PAID", "order_amount": 62000, "payment_status": "SUCCESS", "payment_amount": 62000, "is_captured": true, "authorization_action": "CAPTURE", "authorization_status": "SUCCESS", "captured_amount": 47000}, "note": "read from GET /orders/{id} and /orders/{id}/payments after the capture; no field in either response reports the uncaptured remainder as released"}, "hash": "f16bca9a8c1af825f42ff38e8cbbbcf04babd9d42cc27e1c64df6cce73c549b3", "signature": "c3090a171e54f1081fd9c6dd4d3c57ef9fc2b8cbf7b3671da2fb493ed74e1427586e9be941eeac5c744f1b5cf939ed452d2905628e0238e0f0b41e7c9cc13d01"}, {"seq": 10, "prev_hash": "f16bca9a8c1af825f42ff38e8cbbbcf04babd9d42cc27e1c64df6cce73c549b3", "timestamp": "2026-09-20T12:55:23.454303+00:00", "actor": "policy", "event_type": "policy_decision", "payload": {"rule": "remainder_release_unverified", "amount": 15000, "capability": "cashfree_preauth.remainder_auto_released", "tier": "unverified", "hold_expiry_days": 7, "note": "the uncaptured remainder is not recorded as released: this run did not observe it. Cashfree documents that an authorisation not captured within seven days is released and is silent on the remainder of a partial capture; see probe_cashfree_release"}, "hash": "9a554b13d6121a0bbb7dd20d929fefda62b305fa39feca37b0ca786de0930751", "signature": "d56c405749121f156268ccc8b6d0ea1cf552acb6bcfda83574cd2b978693718554e31a9982870a1f80f53a07558578d93e778fbb3dbb1035d7ac19e9363a1e0a"}]}</script>
  <script>
  
// The packet is set once for a static page and re-set per run for the live demo.
let PACKET = null, GENESIS = null;
async function setPacket(p) { PACKET = p; GENESIS = p.genesis_hash; await loadKey(); }

// Canonical bytes, two generations. A packet declares which one its hashes were
// taken over (`canonicalization`); a packet that declares nothing is legacy.
//
// jcs-int: RFC 8785 restricted to integers. Keys sort by UTF-16 code unit (which
// is what Array.prototype.sort does); numbers must be safe integers; nothing is
// stringified. Must match amanat.evidence.canonical byte for byte — the tests
// execute this very source under Node.
function canonical(v) {
  if (v === null) return 'null';
  switch (typeof v) {
    case 'boolean': return v ? 'true' : 'false';
    case 'string': return JSON.stringify(v);
    case 'number':
      if (!Number.isSafeInteger(v)) throw new Error('non-integer or unsafe number ' + v);
      return String(v);
    case 'object':
      if (Array.isArray(v)) return '[' + v.map(canonical).join(',') + ']';
      return '{' + Object.keys(v).sort()
        .map(k => JSON.stringify(k) + ':' + canonical(v[k])).join(',') + '}';
    default: throw new Error('unsupported value of type ' + typeof v);
  }
}
// amanat-v1 (legacy): Python json.dumps(sort_keys=True, separators=(',', ':'),
// ensure_ascii=False). Kept so packets exported before jcs-int still verify.
function canonicalV1(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canonicalV1).join(',') + ']';
  return '{' + Object.keys(v).sort()
    .map(k => JSON.stringify(k) + ':' + canonicalV1(v[k])).join(',') + '}';
}
function canonicalFor(p) { return p && p.canonicalization === 'jcs-int' ? canonical : canonicalV1; }
function digestInputFor(e, canon) {
  return canon({ seq: e.seq, prev_hash: e.prev_hash, timestamp: e.timestamp,
    actor: e.actor, event_type: e.event_type, payload: e.payload });
}
function digestInput(e) { return digestInputFor(e, canonicalFor(PACKET)); }

function hexToBytes(h) {
  const a = new Uint8Array(h.length / 2);
  for (let i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16);
  return a;
}
async function sha256hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
let pubKey = null, ed25519 = true;
async function loadKey() {
  try {
    pubKey = await crypto.subtle.importKey('raw', hexToBytes(PACKET.public_key),
      { name: 'Ed25519' }, false, ['verify']);
  } catch (e) { ed25519 = false; }
}

// What a green result is allowed to mean. A packet embeds the key it was signed
// with, so on its own it proves only that it is internally consistent and signed
// by that key — anyone can produce such a packet. It is bound to a party only by
// something the reader already holds: the signer's key (#key=<hex>) or a
// checkpoint of the chain (#len=<n>&head=<hash>) taken earlier, which also
// exposes entries removed from the end.
function assessTrust(packet, fragment) {
  const pins = {};
  String(fragment || '').replace(/^#/, '').split('&').forEach(kv => {
    const i = kv.indexOf('=');
    if (i > 0) pins[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  const out = { ok: true, keyPinned: false, checkpointPinned: false, lines: [] };
  if (pins.key) {
    const match = pins.key.toLowerCase() === String(packet.public_key).toLowerCase();
    out.ok = out.ok && match; out.keyPinned = match;
    out.lines.push(match ? 'The signing key matches the key you pinned.'
      : 'The signing key does NOT match the key you pinned — this packet was not signed by that party.');
  } else {
    out.lines.push('Signing key not pinned: this shows the record is internally consistent and '
      + 'signed by the key above, not who holds that key — anyone can produce such a packet. '
      + 'Pin the key you trust by opening this page with #key=<hex>.');
  }
  const n = parseInt(pins.len, 10);
  if (pins.head || pins.len) {
    if (!pins.head || !(n > 0)) {
      out.ok = false;
      out.lines.push('A checkpoint needs both len and head; it was not applied.');
    } else if (packet.entries.length < n) {
      out.ok = false;
      out.lines.push('Truncated: the packet has ' + packet.entries.length
        + ' entries but the checkpoint covers ' + n + '.');
    } else if (packet.entries[n - 1].hash !== pins.head) {
      out.ok = false;
      out.lines.push('This packet does not extend the checkpoint you pinned: entry '
        + (n - 1) + ' differs from the committed head.');
    } else {
      out.checkpointPinned = true;
      out.lines.push('The packet extends the checkpoint you pinned (' + n + ' entries).');
    }
  } else {
    out.lines.push('No checkpoint pinned: entries removed from the end of the record '
      + 'would not be detected.');
  }
  return out;
}

async function verifyEntry(e, expectedPrev) {
  let hashOK = false;
  try { hashOK = (await sha256hex(digestInput(e))) === e.hash; } catch (_) { hashOK = false; }
  const linkOK = e.prev_hash === expectedPrev;
  let sigOK = true;
  if (ed25519 && pubKey)
    sigOK = await crypto.subtle.verify({ name: 'Ed25519' }, pubKey,
      hexToBytes(e.signature), hexToBytes(e.hash));
  return { hashOK, linkOK, sigOK, ok: hashOK && linkOK && sigOK };
}
function readEntriesFromDOM() {
  return PACKET.entries.map((e, i) => {
    const el = document.querySelector('#pl-' + i);
    if (el) { try { e.payload = JSON.parse(el.textContent); } catch (_) {} }
    return e;
  });
}
async function verifyAll() {
  const entries = readEntriesFromDOM();
  let prev = GENESIS, allOK = true, brokenAt = null;
  for (let i = 0; i < entries.length; i++) {
    const r = await verifyEntry(entries[i], prev);
    const chk = document.querySelector('#chk-' + i);
    chk.textContent = r.ok ? 'signed & linked'
      : (!r.hashOK ? 'content altered' : !r.linkOK ? 'broken link' : 'bad signature');
    chk.className = 'chk ' + (r.ok ? 'ok' : 'bad');
    document.querySelector('#e-' + i).classList.toggle('broken', !r.ok);
    if (!r.ok && brokenAt === null) { brokenAt = i; allOK = false; }
    prev = entries[i].hash;
  }
  const trust = assessTrust(PACKET, typeof location !== 'undefined' ? location.hash : '');
  const b = document.getElementById('banner'), t = document.getElementById('banner-text');
  b.className = 'banner ' + (allOK && trust.ok ? 'ok' : 'bad');
  t.textContent = !allOK ? 'Tampered — entry ' + brokenAt + ' no longer matches its signature'
    : !trust.ok ? 'Internally consistent — but NOT what you pinned'
    : !ed25519 ? 'Hash-linked — signatures unchecked (this browser lacks Ed25519)'
    : trust.keyPinned ? 'Verified against the key you pinned — every entry signed, hashed and linked'
    : 'Consistent — every entry is hash-linked and signed by the key shown (key not pinned)';
  const tr = document.getElementById('trust');
  if (tr) tr.textContent = trust.lines.join(' ');
}
function tamper() {
  const idx = PACKET.entries.findIndex(e => e.event_type === 'rail_transition');
  if (idx < 0) return;
  const el = document.querySelector('#pl-' + idx);
  const p = JSON.parse(el.textContent);
  if ('amount' in p) p.amount = 1; else p._tampered = true;
  el.textContent = JSON.stringify(p, null, 2);
  verifyAll();
}

  function render(){
    document.getElementById('pk').textContent=PACKET.public_key.slice(0,16)+'…';
    document.getElementById('count').textContent=PACKET.entries.length+' entries';
    document.getElementById('entries').innerHTML=PACKET.entries.map((e,i)=>
      `<div class="entry" id="e-${i}"><b>#${e.seq}</b> ${e.event_type} · ${e.actor}
       <span class="chk" id="chk-${i}">…</span>
       <pre id="pl-${i}" contenteditable="true">${JSON.stringify(e.payload,null,2)}</pre>
       <div class="hash">${e.hash}</div></div>`).join('');
  }
  (async () => { await setPacket(JSON.parse(document.getElementById('packet').textContent)); render(); await verifyAll(); })();
